<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Strategy Toolkit – Vier-Felder-Matrix mit markierter Position">
  <!-- Zeichen des Toolkits: das Vier-Felder-Schema, das SWOT, BCG, Ansoff,
       die Stakeholder-Matrix und die strategischen Gruppen gemeinsam haben.
       Das hervorgehobene Feld oben links ist die gewählte Position – in der
       BCG-Lesart die Stars, in der SWOT die Stärken. -->
  <rect width="64" height="64" rx="14" fill="#0071e3"/>
  <g fill="#ffffff">
    <rect x="14" y="14" width="16" height="16" rx="3.5"/>
    <rect x="34" y="14" width="16" height="16" rx="3.5" opacity="0.42"/>
    <rect x="14" y="34" width="16" height="16" rx="3.5" opacity="0.42"/>
    <rect x="34" y="34" width="16" height="16" rx="3.5" opacity="0.42"/>
  </g>
</svg>
